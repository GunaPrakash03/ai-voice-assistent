services:
  redis:
    image: redis:7-alpine
    container_name: voice-redis
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: voice-livekit
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"      # HTTP + WebSocket signalling
      - "7881:7881"      # TCP fallback for restrictive networks
      - "50000-50100:50000-50100/udp"  # RTP media

  agent:
    build: .
    image: voice-agent:dev
    container_name: voice-agent-worker
    depends_on:
      - livekit
    environment:
      # The worker reaches LiveKit on the compose network, not localhost.
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      STT_MODEL: ${STT_MODEL:-nova-3}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      CARTESIA_VOICE_ID: ${CARTESIA_VOICE_ID:-f786b574-daa5-4673-aa0c-cbe3e8534c02}
      TTS_MODEL: ${TTS_MODEL:-sonic-3}
    volumes:
      - ./agent:/app/agent:ro
      - ./samples:/app/samples:ro
    restart: unless-stopped
