services:
  redis:
    image: redis:7-alpine
    container_name: voice-redis
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: voice-livekit
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"      # HTTP + WebSocket signalling
      - "127.0.0.1:7881:7881"      # TCP fallback for restrictive networks
      - "50000-50100:50000-50100/udp"  # RTP media
